<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <!-- فلاتر موقع build این مقدار را جایگزین می‌کند. اگر اینجا "/" ثابت
       بماند، «flutter build web --base-href=/<repo>/» خطا می‌دهد و اپ روی
       GitHub Pages (که زیرمسیر دارد) هیچ فایلی را پیدا نمی‌کند. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="فروشگاه و آکادمی فوتبال پرشین بال">

  <!-- پیش‌نمایشِ لینک در تلگرام/واتساپ/توییتر: بدونِ این تگ‌ها پیام‌رسان‌ها
       نامِ قدیمیِ قالب و «A new Flutter project» را از کشِ خودشان نشان
       می‌دادند. آدرسِ تصویر باید مطلق باشد؛ اگر دامنه عوض شد، اینجا و
       og:url را به‌روز کنید. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="پرشین بال">
  <meta property="og:title" content="پرشین بال">
  <meta property="og:description" content="فروشگاه و آکادمی فوتبال؛ دوره‌های آموزشی، کفش و تجهیزات ورزشی">
  <meta property="og:url" content="https://persianball.github.io/PersianballUIV3/">
  <meta property="og:image" content="https://persianball.github.io/PersianballUIV3/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="لوگوی پرشین بال">
  <meta property="og:locale" content="fa_IR">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="پرشین بال">
  <meta name="twitter:description" content="فروشگاه و آکادمی فوتبال؛ دوره‌های آموزشی، کفش و تجهیزات ورزشی">
  <meta name="twitter:image" content="https://persianball.github.io/PersianballUIV3/icons/Icon-512.png">

  <!-- رنگ نوار مرورگر و نوار وضعیتِ اپِ نصب‌شده -->
  <meta name="theme-color" content="#1B7A3E">
  <meta name="color-scheme" content="light">

  <!-- iOS: سافاری از manifest نام و آیکن را نمی‌خواند و این تگ‌ها را لازم دارد -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="پرشین بال">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>پرشین بال</title>

  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }

    /* جهتِ متنِ خودِ اپ را Flutter از Directionality می‌گیرد، نه از HTML.
       ولی ویدیو و وب‌ویو (platform view) عنصرِ واقعیِ HTML هستند که فلاتر
       با position:absolute + transform جا می‌اندازد؛ در سندِ rtl نقطه‌ی
       شروعِ این عناصر لبه‌ی راست است و ویدیوی اسلایدر ~۱۲۰px به راست
       می‌لغزید و سمتِ چپش نوارِ سیاه می‌ماند. */
    flutter-view { direction: ltr; }

    /* صفحه‌ی بارگذاری: فلاتر وب چند ثانیه طول می‌کشد تا اولین فریم را بکشد
       و تا آن موقع صفحه کاملاً سفید و بی‌نشانه بود. */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 28px; background: #FFFFFF;
      transition: opacity .35s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img {
      width: 112px; height: 112px;
      animation: splash-breathe 1.6s ease-in-out infinite;
    }
    #splash .bar {
      width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
      background: rgba(27, 122, 62, .14);
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 3px;
      background: #1B7A3E; animation: splash-slide 1.1s ease-in-out infinite;
    }
    @keyframes splash-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    /* در RTL نوار از راست به چپ حرکت می‌کند */
    @keyframes splash-slide { 0% { transform: translateX(160%); } 100% { transform: translateX(-260%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash img, #splash .bar::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="در حال بارگذاری">
    <img src="icons/splash_logo.png" alt="پرشین بال">
    <div class="bar"></div>
  </div>
  <noscript>برای استفاده از پرشین بال، جاوااسکریپت مرورگر را فعال کنید.</noscript>

  <script>
    // صفحه‌ی بارگذاری با اولین فریمِ فلاتر محو و حذف می‌شود.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('hide');
      setTimeout(function () { s.remove(); }, 400);
    });

    // رویدادِ نصب را نگه می‌داریم تا بعداً یک دکمه‌ی «نصب اپ» داخل خودِ اپ
    // بتواند از آن استفاده کند. preventDefault نمی‌شود، پس پیشنهادِ نصبِ
    // خودِ مرورگر همچنان نمایش داده می‌شود.
    window.addEventListener('beforeinstallprompt', function (e) {
      window.__pwaInstallPrompt = e;
    });
    window.addEventListener('appinstalled', function () {
      window.__pwaInstallPrompt = null;
    });
  </script>

  <!-- بارگذارِ فعلیِ فلاتر: موتور را بار می‌کند و service worker را با شماره‌ی
       نسخه‌ی همین build ثبت می‌کند. قالبِ قبلی main.dart.js را مستقیم بار
       می‌کرد، تا ۴ ثانیه منتظرِ service worker می‌ماند و در هر build هشدارِ
       «serviceWorkerVersion is deprecated» می‌داد. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
