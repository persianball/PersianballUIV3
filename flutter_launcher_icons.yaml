# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icons/pers_icon.png"

  android: "launcher_icon"
  # image_path_android: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  # آیکن تطبیقی اندروید: لانچر لایه‌ی جلویی را با دایره/اسکوئرکل برش می‌دهد
  # و فقط دایره‌ی ۶۶dp وسطِ لایه‌ی ۱۰۸dp امن است (شعاع ~۳۰٫۵٪).
  # دورترین نقطه‌ی لوگو (نوکِ نوار سبز) ~۳۶٫۵٪ از مرکز فاصله دارد، پس
  # inset باید حداقل ~۸٪ باشد. ۱۰ بزرگ‌ترین مقدارِ امن با کمی حاشیه است؛
  # ۱۶ هم امن بود ولی با پدینگِ خودِ تصویر، لوگو بی‌دلیل ریز می‌شد.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/pers_icon.png"
  adaptive_icon_foreground_inset: 10
  # adaptive_icon_monochrome: "assets/icon/monochrome.png"

  ios: true
  # image_path_ios: "assets/icon/icon.png"
  remove_alpha_ios: true
  # image_path_ios_dark_transparent: "assets/icon/icon_dark.png"
  # image_path_ios_tinted_grayscale: "assets/icon/icon_tinted.png"
  # desaturate_tinted_to_grayscale_ios: true
  # background_color_ios: "#ffffff"

  web:
    generate: true
    image_path: "assets/icons/pers_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#1B7A3E"

  windows:
    generate: true
    image_path: "assets/icons/pers_icon.png"
    icon_size: 48 # min:48, max:256, default: 48

  macos:
    generate: true
    image_path: "assets/icons/pers_icon.png"
